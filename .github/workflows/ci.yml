name: CI

on:
  push:
  pull_request:
  # allow running the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest

    container:
      image: registry.opensuse.org/opensuse/leap:16.0

    steps:
      # git and tar are needed by the checkout action
      - name: Install dependencies
        run: zypper --non-interactive install --no-recommends --allow-downgrade git tar gzip make findutils ShellCheck shfmt hadolint

      - name: Git checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: make check

      - name: Check formatting
        run: make format

      - name: Validate Dockerfile
        run: make lint-dockerfile

  devcontainer-json:
    runs-on: ubuntu-latest

    container:
      image: registry.opensuse.org/opensuse/leap:16.0

    steps:
      - name: Install dependencies
        run: zypper --non-interactive install --no-recommends --allow-downgrade git tar gzip make findutils python3-pipx

      - name: Git checkout
        uses: actions/checkout@v7

      # check-jsonschema is not packaged, json5 is needed for parsing JSONC files
      - name: Install check-jsonschema
        run: |
          pipx install check-jsonschema
          pipx inject check-jsonschema json5
        env:
          PIPX_HOME: /opt/pipx
          PIPX_BIN_DIR: /usr/local/bin

      - name: Validate devcontainer.json file
        run: make check-devcontainer

  # building the images verifies that all packages exist and the commands work
  build:
    runs-on: ubuntu-latest

    name: Build container

    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build .
        working-directory: ./.devcontainer
